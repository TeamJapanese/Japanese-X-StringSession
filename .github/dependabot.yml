version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"

    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "python"
      - "mongodb"

    commit-message:
      prefix: "chore(deps)"

    ignore:
      - dependency-name: "python-telegram-bot"
        update-types: ["version-update:semver-major"]
